include:
    - component: $CI_SERVER_FQDN/operational/gitlab-ci-components/setup-project-playground-3@1
      inputs:
          octobercms_license_key: "${PLAYGROUND_LICENSE_KEY}"
          github_machine_user_token: ${GITHUB_MACHINE_USER_TOKEN}
    - component: $CI_SERVER_FQDN/operational/gitlab-ci-components/setup-project-playground-4@1
      inputs:
          octobercms_license_key: "${PLAYGROUND_LICENSE_KEY}"
          github_machine_user_token: ${GITHUB_MACHINE_USER_TOKEN}
    - component: $CI_SERVER_FQDN/operational/gitlab-ci-components/rules-mr-events@1
    - component: $CI_SERVER_FQDN/operational/gitlab-ci-components/danger@1

Tests:
    extends:
        - .rules-mr-events
        - .setup-project-playground-4
    script:
        - mkdir tests
        - composer require "initbiz/initdry-plugin:dev-${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME} as 1.12.0"
        - vendor/bin/pest --parallel --ci --bail

Tests-october-3:
    extends:
        - .rules-mr-events
        - .setup-project-playground-3
    script:
        - composer require "initbiz/initdry-plugin:dev-${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME} as 1.12.1"
        - vendor/bin/pest --parallel --ci --bail

Linter:
    extends:
        - .rules-mr-events
        - .setup-project-playground-4
    script:
        - composer require "initbiz/initdry-plugin:dev-${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME} as 1.12.0"
        - php artisan linter:code -b plugins/initbiz/initdry

Danger-PHP:
    extends:
        - .danger
        - .rules-mr-events
